name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.23.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Format check
        if: runner.os == 'Linux'
        run: |
          test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race
        if: runner.os == 'Linux'
        run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Cross-compile release targets
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -o dist/bg-cli-windows-amd64.exe ./cmd/bg-cli
          GOOS=linux GOARCH=amd64 go build -o dist/bg-cli-linux-amd64 ./cmd/bg-cli
          GOOS=darwin GOARCH=amd64 go build -o dist/bg-cli-darwin-amd64 ./cmd/bg-cli
          GOOS=darwin GOARCH=arm64 go build -o dist/bg-cli-darwin-arm64 ./cmd/bg-cli
          ls -la dist
      - name: Vulnerability scan
        run: |
          GOTOOLCHAIN=auto go run golang.org/x/vuln/cmd/govulncheck@latest ./...
