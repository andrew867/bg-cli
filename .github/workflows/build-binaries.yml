name: build-binaries

# Produces downloadable self-contained archives on every push/PR to main
# and on demand. Tagged releases use the separate release workflow.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Snapshot build with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2.20"
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: bg-cli-binaries
          path: |
            dist/bg-cli_*.tar.gz
            dist/bg-cli_*.zip
            dist/bg-cli_*_checksums.txt
            dist/bg-cli-*-source.tar.gz
          if-no-files-found: error
          retention-days: 14
