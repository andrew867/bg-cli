name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Test
        run: |
          go test ./...
          go vet ./...
      - name: Build artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          ldflags="-X github.com/andrew867/bg-cli/internal/cli.Version=${version} -X main.version=${version}"
          GOOS=windows GOARCH=amd64 go build -ldflags "$ldflags" -o dist/bg-cli-windows-amd64.exe ./cmd/bg-cli
          GOOS=linux   GOARCH=amd64 go build -ldflags "$ldflags" -o dist/bg-cli-linux-amd64 ./cmd/bg-cli
          GOOS=darwin  GOARCH=amd64 go build -ldflags "$ldflags" -o dist/bg-cli-darwin-amd64 ./cmd/bg-cli
          GOOS=darwin  GOARCH=arm64 go build -ldflags "$ldflags" -o dist/bg-cli-darwin-arm64 ./cmd/bg-cli
          (
            cd dist
            sha256sum bg-cli-* > SHA256SUMS
          )
          go version -m dist/bg-cli-linux-amd64 > dist/sbom-gomod.txt
          ls -la dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/bg-cli-windows-amd64.exe
            dist/bg-cli-linux-amd64
            dist/bg-cli-darwin-amd64
            dist/bg-cli-darwin-arm64
            dist/SHA256SUMS
            dist/sbom-gomod.txt
