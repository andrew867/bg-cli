# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: bg-cli

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: bg-cli
    main: ./cmd/bg-cli
    binary: bg-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/andrew867/bg-cli/internal/cli.Version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - docs/*

source:
  enabled: true
  name_template: "{{ .ProjectName }}-{{ .Version }}-source"
  format: tar.gz
  prefix_template: "{{ .ProjectName }}-{{ .Version }}/"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^test"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: andrew867
    name: bg-cli
  name_template: "bg-cli {{.Tag}}"
  draft: false
  prerelease: auto
  footer: |
    ## Install

    Download the archive for your platform, extract it, and place `bg-cli` on your `PATH`.

    Verify checksums:

    ```bash
    sha256sum -c bg-cli_{{ .Version }}_checksums.txt
    ```

    Or install from source with Go 1.23+:

    ```bash
    go install github.com/andrew867/bg-cli/cmd/bg-cli@{{ .Tag }}
    ```

    **Unofficial client — not affiliated with or endorsed by BIG Games.**

snapshot:
  version_template: "{{ .Version }}-next"

announce:
  skip: true
